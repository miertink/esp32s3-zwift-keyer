<svg width="760" height="440" viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg"
     font-family="Segoe UI, Arial, sans-serif">
  <rect width="760" height="440" fill="#ffffff"/>

  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">
    ESP32-S3 DevKit — schematic layout (illustrative, not a real photo)
  </text>
  <text x="380" y="56" text-anchor="middle" font-size="12" fill="#555555">
    Exact port position/spacing varies by board vendor — check your board's own silkscreen labels to confirm.
  </text>

  <!-- PCB board -->
  <rect x="230" y="110" width="380" height="240" rx="16" fill="#0b5d3b" stroke="#053b25" stroke-width="3"/>

  <!-- ESP32-S3-WROOM-1 module -->
  <rect x="360" y="150" width="180" height="150" rx="6" fill="#3a3a3a" stroke="#1a1a1a" stroke-width="2"/>
  <text x="450" y="220" text-anchor="middle" fill="#f2f2f2" font-size="15" font-weight="bold">ESP32-S3</text>
  <text x="450" y="242" text-anchor="middle" fill="#f2f2f2" font-size="13">WROOM-1</text>

  <!-- BOOT / RESET buttons -->
  <circle cx="580" cy="170" r="11" fill="#c0392b" stroke="#7f1d13" stroke-width="2"/>
  <text x="580" y="148" text-anchor="middle" fill="#053b25" font-size="12">BOOT</text>
  <circle cx="580" cy="290" r="11" fill="#c0392b" stroke="#7f1d13" stroke-width="2"/>
  <text x="580" y="318" text-anchor="middle" fill="#053b25" font-size="12">RESET</text>

  <!-- Onboard RGB LED -->
  <circle cx="580" cy="230" r="8" fill="#7dd3fc" stroke="#0369a1" stroke-width="2"/>
  <text x="580" y="252" text-anchor="middle" fill="#053b25" font-size="11">LED</text>

  <!-- USB-C ports on left edge -->
  <rect x="210" y="165" width="40" height="24" rx="5" fill="#d9d9d9" stroke="#7a7a7a" stroke-width="2"/>
  <rect x="210" y="275" width="40" height="24" rx="5" fill="#d9d9d9" stroke="#7a7a7a" stroke-width="2"/>

  <!-- Callout: UART port (top) -->
  <line x1="230" y1="177" x2="120" y2="177" stroke="#1a5fb4" stroke-width="2.5"/>
  <circle cx="230" cy="177" r="4" fill="#1a5fb4"/>
  <rect x="20" y="120" width="220" height="86" rx="10" fill="#eaf2fd" stroke="#1a5fb4" stroke-width="2"/>
  <text x="130" y="144" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b3d91">UART port</text>
  <text x="130" y="164" text-anchor="middle" font-size="12" fill="#0b3d91">Flashing + serial log</text>
  <text x="130" y="182" text-anchor="middle" font-size="12" fill="#0b3d91">Stable — always COM4</text>
  <text x="130" y="200" text-anchor="middle" font-size="11" fill="#3a63a8">(use for pio run -t upload)</text>

  <!-- Callout: Native USB port (bottom) -->
  <line x1="230" y1="287" x2="120" y2="287" stroke="#8b2fc9" stroke-width="2.5"/>
  <circle cx="230" cy="287" r="4" fill="#8b2fc9"/>
  <rect x="20" y="264" width="220" height="86" rx="10" fill="#f6ecfd" stroke="#8b2fc9" stroke-width="2"/>
  <text x="130" y="288" text-anchor="middle" font-size="14" font-weight="bold" fill="#5b1d8a">Native USB port</text>
  <text x="130" y="308" text-anchor="middle" font-size="12" fill="#5b1d8a">The "keyboard" your PC sees</text>
  <text x="130" y="326" text-anchor="middle" font-size="12" fill="#5b1d8a">Chameleon — disappears from</text>
  <text x="130" y="342" text-anchor="middle" font-size="11" fill="#7b3fae">COM list once HID firmware runs</text>

  <!-- Bottom legend -->
  <text x="380" y="400" text-anchor="middle" font-size="12" fill="#555555">
    Plug both in at once during development: flash/log on UART, test the keyboard on Native USB.
  </text>
  <text x="380" y="420" text-anchor="middle" font-size="11" fill="#888888">
    See project.md section 10 for the full port-identification details (Device Manager signatures, etc.).
  </text>
</svg>
