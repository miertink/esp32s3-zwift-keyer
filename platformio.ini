; PlatformIO Project Configuration File
;
; BLE Remote -> USB HID Bridge (Zwift Navigation Remote)
; ESP32-S3 DevKit N16R8: NimBLE central (input) + TinyUSB HID keyboard (output)
;
; See project.md for full hardware/firmware spec.

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; --- Gravacao e monitor pela UART (COM4) ---
upload_port = COM4
monitor_port = COM4
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; --- USB nativo como HID (TinyUSB), NAO como CDC ---
; O S3 tem USB-OTG nativo; para o teclado HID, usar o modo TinyUSB.
board_build.arduino.usb_mode = 1              ; 1 = TinyUSB (permite HID)
board_build.arduino.usb_cdc_on_boot = 0       ; 0 = nao ocupar o USB nativo com CDC serial
                                               ; (log fica na UART/COM4, USB nativa livre p/ HID)

; --- Flash 16MB / PSRAM 8MB (N16R8) ---
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.3
    bblanchon/ArduinoJson @ ^7
    ; TinyUSB: usa o embutido no core Arduino-ESP32 3.x (via ARDUINO_USB_MODE)
